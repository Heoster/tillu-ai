# Render Blueprint — TILLU Runtime (Render account B)
# Point a Render Blueprint at THIS file (deploy/render-runtime/render.yaml).
# Do NOT use this file to deploy the Brain service — use deploy/render-brain/render.yaml.
services:
  - type: web
    name: tillu-runtime
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render-runtime/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SERVICE_ROLE
        value: runtime
      - key: SERVICE_NAME
        value: tillu-runtime
      - key: BUILD_SHA
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_USER_ID
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: TILLU_INTERNAL_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BROWSER_HEADLESS
        value: "true"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
