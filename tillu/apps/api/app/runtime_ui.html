<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tillu Runtime — Browser Explorer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0b14;--surface:#13111e;--surface2:#1a1728;--surface3:#221f30;
    --line:#2a2638;--text:#e8e4f0;--muted:#6b6480;--accent:#7c5cbf;
    --accent2:#9b7ee0;--success:#48d594;--warn:#ffb84d;--danger:#ff6b6b;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.5 'Inter',system-ui,sans-serif}
  #app{height:100vh;display:flex;flex-direction:column}
  #titlebar{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
  #titlebar .logo{font:700 14px 'Inter';letter-spacing:.04em;color:var(--accent2)}
  #titlebar .logo span{color:var(--muted);font-weight:400}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
  .status-dot.ready{background:var(--success);box-shadow:0 0 6px var(--success)}
  .status-dot.busy{background:var(--warn);animation:pulse 1s infinite}
  .status-dot.error{background:var(--danger)}
  #status-text{font-size:11px;color:var(--muted)}
  .spacer{flex:1}
  #auth-badge{font-size:10px;color:var(--success);border:1px solid color-mix(in srgb,var(--success) 30%,transparent);border-radius:20px;padding:3px 9px}
  #toolbar{height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
  .nav-btn{width:30px;height:30px;border:1px solid transparent;background:none;color:var(--muted);border-radius:7px;cursor:pointer;display:grid;place-items:center;font-size:15px;transition:background .12s,color .12s}
  .nav-btn:hover:not(:disabled){background:var(--surface2);color:var(--text);border-color:var(--line)}
  .nav-btn:disabled{opacity:.3;cursor:default}
  #url-form{flex:1;display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .15s;position:relative}
  #url-form:focus-within{border-color:var(--accent)}
  #lock-icon{padding:0 8px;font-size:13px;flex-shrink:0;user-select:none}
  #url-input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:13px;padding:7px 10px 7px 0;min-width:0}
  #progress-bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);display:none;animation:sweep 1.3s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  #progress-bar.show{display:block}
  #launch-btn{border:0;background:var(--accent);color:#fff;border-radius:7px;padding:6px 16px;font-size:12px;cursor:pointer;white-space:nowrap}
  #launch-btn:hover{background:var(--accent2)}
  #launch-btn:disabled{opacity:.5;cursor:default}
  #sidebar-toggle{width:30px;height:30px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:7px;cursor:pointer;display:grid;place-items:center;font-size:13px}
  #page-strip{height:26px;display:none;align-items:center;gap:8px;padding:0 12px;background:var(--surface2);border-bottom:1px solid var(--line);flex-shrink:0;font-size:10px;overflow:hidden}
  #page-strip.show{display:flex}
  #page-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
  #page-url{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  #err-bar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px;background:#2a1018;color:var(--danger);font-size:12px;border-bottom:1px solid #5a2020;flex-shrink:0}
  #err-bar.show{display:flex}
  #err-bar button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px}
  #viewport-row{flex:1;display:flex;overflow:hidden;min-height:0}
  #canvas-zone{flex:1;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;position:relative}
  #browser-canvas{display:none;max-width:100%;max-height:100%;cursor:crosshair;outline:none}
  #browser-canvas.focused{outline:2px solid var(--accent)}
  .cbadge{position:absolute;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);padding:5px 16px;border-radius:20px;font-size:12px;pointer-events:none;white-space:nowrap}
  #loading-badge{top:10px;color:var(--warn);display:none}
  #loading-badge.show{display:block}
  #focus-hint{bottom:8px;color:rgba(255,255,255,.55);font-size:10px;display:none}
  #empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:.5}
  #empty-state svg{width:56px;height:56px;stroke:currentColor;fill:none;stroke-width:1.5}
  #empty-state h2{font-size:20px}
  #empty-state p{font-size:13px;color:var(--muted);text-align:center;max-width:360px;line-height:1.6}
  #empty-state button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:11px 28px;font-size:15px;cursor:pointer}
  #sidebar{width:220px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface);flex-shrink:0;overflow:hidden;transition:width .18s,opacity .18s}
  #sidebar.hidden{width:0;opacity:0;pointer-events:none}
  .stabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
  .stab{flex:1;padding:8px 4px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:3px}
  .stab.active{color:var(--text);border-bottom-color:var(--accent)}
  .sbadge{background:var(--surface2);border-radius:9px;padding:1px 5px;font-size:8px}
  .slist{flex:1;overflow-y:auto}
  .slist::-webkit-scrollbar{width:4px}
  .slist::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .srow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);font-size:10px}
  .stag{font-size:8px;color:var(--muted);flex-shrink:0;min-width:28px;font-family:monospace}
  .slabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slabel.dim{opacity:.4}
  .sact{flex-shrink:0;font-size:8px;padding:2px 7px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:4px;cursor:pointer}
  .sact:hover{background:var(--surface3);border-color:var(--accent)}
  .sact:disabled{opacity:.3;cursor:default}
  .sempty{padding:18px 12px;text-align:center;color:var(--muted);font-size:10px;line-height:1.6}
  #session-info{border-top:1px solid var(--line);padding:8px;flex-shrink:0;display:none}
  #session-id-label{font-size:8px;color:var(--muted);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hint-bar{height:22px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0}
  .hint{font-size:9px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .hint kbd{background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:1px 4px;font-size:8px;font-family:monospace;color:var(--text)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="logo">TILLU <span>runtime</span></div>
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">ready</span>
    <div class="spacer"></div>
    <div id="auth-badge">🔐 signed in</div>
  </div>

  <div id="toolbar">
    <button class="nav-btn" id="btn-back" disabled title="Back (Alt+←)">&#8592;</button>
    <button class="nav-btn" id="btn-forward" disabled title="Forward (Alt+→)">&#8594;</button>
    <button class="nav-btn" id="btn-reload" disabled title="Reload (Ctrl+R)">&#8635;</button>
    <form id="url-form" onsubmit="return false">
      <span id="lock-icon">🌐</span>
      <input id="url-input" type="text" value="https://google.com" placeholder="Search or enter address" autocomplete="off" spellcheck="false"/>
      <div id="progress-bar"></div>
    </form>
    <button id="launch-btn">🚀 Launch</button>
    <button class="nav-btn" id="btn-close" disabled title="Close session" style="font-size:12px;color:var(--danger)">✕</button>
    <button id="sidebar-toggle" title="Toggle panel">⊟</button>
  </div>

  <div id="page-strip"><span id="page-title"></span><span id="page-url"></span></div>
  <div id="err-bar"><span id="err-msg"></span><button onclick="hideErr()">✕</button></div>

  <div id="viewport-row">
    <div id="canvas-zone">
      <canvas id="browser-canvas" width="1280" height="800" tabindex="0"></canvas>
      <div class="cbadge" id="loading-badge">Loading…</div>
      <div id="empty-state">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <h2>Browser Explorer</h2>
        <p>Enter an address and hit Launch to get a live Playwright session.</p>
        <button id="empty-launch-btn">🚀 Launch browser</button>
      </div>
      <div class="cbadge" id="focus-hint" style="bottom:8px;top:auto">Click canvas · type directly · Ctrl+L for address bar</div>
    </div>

    <div id="sidebar">
      <div class="stabs">
        <button class="stab active" data-tab="el">All<span class="sbadge" id="badge-el">0</span></button>
        <button class="stab" data-tab="lk">Links<span class="sbadge" id="badge-lk">0</span></button>
        <button class="stab" data-tab="in">Inputs<span class="sbadge" id="badge-in">0</span></button>
        <button class="stab" data-tab="bt">Btns<span class="sbadge" id="badge-bt">0</span></button>
      </div>
      <div class="slist" id="sidebar-list"></div>
      <div id="session-info">
        <div class="srow"><span class="stag">session</span><span id="session-id-label">—</span></div>
      </div>
    </div>
  </div>

  <div id="hint-bar">
    <div class="hint"><kbd>Ctrl+L</kbd> address</div>
    <div class="hint"><kbd>Ctrl+R</kbd> reload</div>
    <div class="hint"><kbd>Alt+←/→</kbd> back/fwd</div>
    <div class="hint"><kbd>Scroll</kbd> scroll</div>
    <div class="hint" style="margin-left:auto;color:var(--accent)" id="fps-label">— fps</div>
  </div>
</div>

<script>
'use strict';

const VPORT_W = 1280, VPORT_H = 800;
const UI_TOKEN = (typeof window.__RT_TOKEN__ !== 'undefined') ? window.__RT_TOKEN__ : '';

let sessionId = '', elements = [], isLoading = false;
let sidebarOpen = true, activeTab = 'el';
let streamAbort = null, moveTimer = null, canvasFocused = false;
let frameCount = 0, fpsTimer = 0;

const canvas   = document.getElementById('browser-canvas');
const ctx      = canvas.getContext('2d');
const urlInput = document.getElementById('url-input');

function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  return path + (UI_TOKEN ? sep + '_t=' + encodeURIComponent(UI_TOKEN) : '');
}

async function api(path, opts = {}) {
  const res = await fetch(apiUrl(path), {
    ...opts,
    headers: { 'content-type': 'application/json', ...(opts.headers || {}) }
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.detail || `HTTP ${res.status}`);
  }
  return res.json();
}

function setStatus(dot, text) {
  document.getElementById('status-dot').className = 'status-dot ' + dot;
  document.getElementById('status-text').textContent = text;
}
function showErr(msg) { document.getElementById('err-msg').textContent = msg; document.getElementById('err-bar').classList.add('show'); }
function hideErr() { document.getElementById('err-bar').classList.remove('show'); }
function setLoading(v) {
  isLoading = v;
  document.getElementById('loading-badge').classList.toggle('show', v && !!sessionId);
  document.getElementById('progress-bar').classList.toggle('show', v);
  document.getElementById('btn-reload').textContent = v ? '✕' : '⟳';
}

// ── MJPEG canvas stream ───────────────────────────────────────────────────────
// Proper approach: parse the multipart boundary, extract Content-Length from
// each part header, then slice exactly that many bytes as the JPEG payload.
// Falls back to FF D8 / FF D9 marker scan if Content-Length is missing.

async function startStream(sid) {
  if (streamAbort) streamAbort.abort();
  const ctrl = new AbortController();
  streamAbort = ctrl;

  try {
    const res = await fetch(apiUrl(`/api/browser-control/sessions/${sid}/stream?fps=15`), {
      signal: ctrl.signal
    });
    if (!res.ok) { showErr('Stream failed: HTTP ' + res.status); return; }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('latin1'); // byte-safe for binary
    let buf = new Uint8Array(0);
    fpsTimer = Date.now();

    // Helper: find byte sequence needle in haystack starting at offset
    function find(haystack, needle, start = 0) {
      outer: for (let i = start; i <= haystack.length - needle.length; i++) {
        for (let j = 0; j < needle.length; j++) {
          if (haystack[i + j] !== needle[j]) continue outer;
        }
        return i;
      }
      return -1;
    }

    const CRLF2 = new Uint8Array([13, 10, 13, 10]); // \r\n\r\n

    function tryDecode() {
      while (true) {
        // Find end of part header (\r\n\r\n)
        const headerEnd = find(buf, CRLF2);
        if (headerEnd === -1) return; // need more data

        const headerText = decoder.decode(buf.slice(0, headerEnd));

        // Parse Content-Length from header
        const clMatch = headerText.match(/Content-Length:\s*(\d+)/i);
        const payloadStart = headerEnd + 4;

        if (clMatch) {
          const payloadLen = parseInt(clMatch[1], 10);
          if (buf.length < payloadStart + payloadLen) return; // need more data
          const jpeg = buf.slice(payloadStart, payloadStart + payloadLen);
          buf = buf.slice(payloadStart + payloadLen);
          drawJpeg(jpeg);
        } else {
          // No Content-Length — scan for FF D8 ... FF D9
          const jpegStart = find(buf, new Uint8Array([0xFF, 0xD8]), payloadStart);
          if (jpegStart === -1) { buf = buf.slice(payloadStart); return; }
          const jpegEnd = find(buf, new Uint8Array([0xFF, 0xD9]), jpegStart + 2);
          if (jpegEnd === -1) return; // need more data
          const jpeg = buf.slice(jpegStart, jpegEnd + 2);
          buf = buf.slice(jpegEnd + 2);
          drawJpeg(jpeg);
        }
      }
    }

    function drawJpeg(bytes) {
      const blob = new Blob([bytes], { type: 'image/jpeg' });
      const burl = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(burl);
        frameCount++;
        const now = Date.now();
        if (now - fpsTimer >= 1000) {
          document.getElementById('fps-label').textContent = frameCount + ' fps';
          frameCount = 0; fpsTimer = now;
        }
      };
      img.onerror = () => URL.revokeObjectURL(burl);
      img.src = burl;
    }

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      // Append new chunk to buffer
      const next = new Uint8Array(buf.length + value.length);
      next.set(buf); next.set(value, buf.length);
      buf = next;
      tryDecode();
    }
  } catch (e) {
    if (e.name !== 'AbortError') showErr('Stream lost — reload the page');
  }
}

function stopStream() {
  if (streamAbort) { streamAbort.abort(); streamAbort = null; }
}

// ── Session ───────────────────────────────────────────────────────────────────
async function launchSession() {
  if (isLoading) return;
  setLoading(true); setStatus('busy', 'starting…'); hideErr();
  try {
    const { session_id } = await api('/api/browser-control/sessions', { method: 'POST' });
    sessionId = session_id;
    document.getElementById('session-id-label').textContent = session_id.slice(0, 18) + '…';
    document.getElementById('session-info').style.display = '';
    document.getElementById('empty-state').style.display = 'none';
    canvas.style.display = 'block';
    document.getElementById('btn-back').disabled = false;
    document.getElementById('btn-forward').disabled = false;
    document.getElementById('btn-reload').disabled = false;
    document.getElementById('btn-close').disabled = false;
    startStream(session_id);
    const target = toFullUrl(urlInput.value);
    setStatus('busy', 'navigating…');
    applyPageState(await api('/api/browser-control/navigate', {
      method: 'POST', body: JSON.stringify({ session_id, url: target })
    }));
  } catch(e) {
    showErr(e.message); setStatus('error', 'failed');
  } finally {
    setLoading(false);
    if (sessionId) { setStatus('ready', 'ready'); document.getElementById('focus-hint').style.display = ''; }
  }
}

async function closeSession() {
  stopStream();
  if (sessionId) try { await api(`/api/browser-control/sessions/${sessionId}`, { method: 'DELETE' }); } catch {}
  sessionId = ''; elements = [];
  canvas.style.display = 'none';
  document.getElementById('empty-state').style.display = '';
  document.getElementById('session-info').style.display = 'none';
  document.getElementById('page-strip').classList.remove('show');
  document.getElementById('focus-hint').style.display = 'none';
  ['btn-back','btn-forward','btn-reload','btn-close'].forEach(id => document.getElementById(id).disabled = true);
  urlInput.value = 'https://google.com';
  renderSidebar();
  setStatus('idle', 'closed');
  document.getElementById('fps-label').textContent = '— fps';
}

// ── Navigation ────────────────────────────────────────────────────────────────
function toFullUrl(v) { return /^https?:\/\//i.test(v.trim()) ? v.trim() : 'https://' + v.trim(); }

function applyPageState(d) {
  if (d.url) urlInput.value = d.url;
  if (d.elements) elements = d.elements;
  document.getElementById('page-title').textContent = d.title || '';
  document.getElementById('page-url').textContent = d.url || '';
  document.getElementById('page-strip').classList.toggle('show', !!(d.title || d.url));
  document.getElementById('lock-icon').textContent = (d.url || '').startsWith('https://') ? '🔒' : '🔓';
  renderSidebar();
}

async function navigate(url) {
  if (!sessionId) { launchSession(); return; }
  const target = toFullUrl(url || urlInput.value);
  setLoading(true); setStatus('busy', 'navigating…'); hideErr(); canvas.focus();
  try { applyPageState(await api('/api/browser-control/navigate', { method: 'POST', body: JSON.stringify({ session_id: sessionId, url: target }) })); }
  catch(e) { showErr(e.message); }
  finally { setLoading(false); setStatus('ready', 'ready'); }
}

async function goBack() {
  if (!sessionId || isLoading) return;
  setLoading(true); setStatus('busy', 'back…');
  try { applyPageState(await api(`/api/browser-control/sessions/${sessionId}/go-back`, { method: 'POST' })); }
  catch(e) { showErr(e.message); }
  finally { setLoading(false); setStatus('ready', 'ready'); }
}

async function goForward() {
  if (!sessionId || isLoading) return;
  setLoading(true); setStatus('busy', 'forward…');
  try { applyPageState(await api(`/api/browser-control/sessions/${sessionId}/go-forward`, { method: 'POST' })); }
  catch(e) { showErr(e.message); }
  finally { setLoading(false); setStatus('ready', 'ready'); }
}

async function reload() {
  if (!sessionId) return;
  if (isLoading) { api('/api/browser-control/keyboard/press', { method: 'POST', body: JSON.stringify({ session_id: sessionId, key: 'Escape' }) }).catch(() => {}); return; }
  setLoading(true); setStatus('busy', 'reloading…');
  try { applyPageState(await api(`/api/browser-control/sessions/${sessionId}/reload`, { method: 'POST' })); }
  catch(e) { showErr(e.message); }
  finally { setLoading(false); setStatus('ready', 'ready'); }
}

// ── Canvas input ──────────────────────────────────────────────────────────────
function canvasCoords(e) {
  const r = canvas.getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) * (VPORT_W / r.width)), y: Math.round((e.clientY - r.top) * (VPORT_H / r.height)) };
}

canvas.addEventListener('click', e => {
  if (!sessionId) return;
  const {x, y} = canvasCoords(e);
  api('/api/browser-control/mouse/click', { method: 'POST', body: JSON.stringify({ session_id: sessionId, x, y, button: 'left' }) }).catch(() => {});
  canvas.focus();
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!sessionId) return;
  const {x, y} = canvasCoords(e);
  api('/api/browser-control/mouse/click', { method: 'POST', body: JSON.stringify({ session_id: sessionId, x, y, button: 'right' }) }).catch(() => {});
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!sessionId) return;
  api('/api/browser-control/mouse/scroll', { method: 'POST', body: JSON.stringify({ session_id: sessionId, x: 0, y: 0, delta_x: Math.round(e.deltaX), delta_y: Math.round(e.deltaY) }) }).catch(() => {});
}, { passive: false });
canvas.addEventListener('mousemove', e => {
  if (!sessionId) return;
  if (moveTimer) clearTimeout(moveTimer);
  moveTimer = setTimeout(() => {
    const {x, y} = canvasCoords(e);
    api('/api/browser-control/mouse/move', { method: 'POST', body: JSON.stringify({ session_id: sessionId, x, y, button: 'left' }) }).catch(() => {});
  }, 50);
});
canvas.addEventListener('focus', () => { canvasFocused = true; canvas.classList.add('focused'); document.getElementById('focus-hint').style.display = 'none'; });
canvas.addEventListener('blur',  () => { canvasFocused = false; canvas.classList.remove('focused'); if (sessionId) document.getElementById('focus-hint').style.display = ''; });

const SKEYS = { Enter:'Enter',Backspace:'Backspace',Delete:'Delete',Escape:'Escape',Tab:'Tab',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',Home:'Home',End:'End',PageUp:'PageUp',PageDown:'PageDown',F5:'F5',F12:'F12',' ':'Space' };
canvas.addEventListener('keydown', e => {
  if (!sessionId) return;
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); urlInput.focus(); urlInput.select(); return; }
  if (e.ctrlKey && e.key === 'r') { e.preventDefault(); reload(); return; }
  if (e.altKey && e.key === 'ArrowLeft')  { e.preventDefault(); goBack(); return; }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goForward(); return; }
  e.preventDefault();
  const k = SKEYS[e.key];
  if (k) api('/api/browser-control/keyboard/press', { method: 'POST', body: JSON.stringify({ session_id: sessionId, key: k }) }).catch(() => {});
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey)
    api('/api/browser-control/keyboard/type', { method: 'POST', body: JSON.stringify({ session_id: sessionId, text: e.key }) }).catch(() => {});
  else if (e.ctrlKey && e.key.length === 1)
    api('/api/browser-control/keyboard/press', { method: 'POST', body: JSON.stringify({ session_id: sessionId, key: 'Control+' + e.key.toUpperCase() }) }).catch(() => {});
});

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const links  = elements.filter(e => e.tag === 'a' && e.href);
  const inputs = elements.filter(e => ['input','textarea','select'].includes(e.tag));
  const btns   = elements.filter(e => e.tag === 'button' || e.role === 'button');
  document.getElementById('badge-el').textContent = elements.length;
  document.getElementById('badge-lk').textContent = links.length;
  document.getElementById('badge-in').textContent = inputs.length;
  document.getElementById('badge-bt').textContent = btns.length;
  let rows = activeTab === 'el' ? elements.slice(0,150) : activeTab === 'lk' ? links : activeTab === 'in' ? inputs : btns;
  const list = document.getElementById('sidebar-list');
  if (!rows.length) { list.innerHTML = `<div class="sempty">Navigate first</div>`; return; }
  list.innerHTML = rows.map(el => {
    const label = esc(el.name || el.value || el.placeholder || el.href || '—');
    const dis = el.disabled ? ' disabled' : '';
    if (activeTab === 'lk')
      return `<div class="srow"><span class="slabel" title="${esc(el.href||'')}">${label}</span><button class="sact" onclick="navTo(${JSON.stringify(el.href||'')})"${dis}>Go</button></div>`;
    return `<div class="srow"><span class="stag">${esc(el.tag)}</span><span class="slabel${el.disabled?' dim':''}">${label}</span><button class="sact" onclick="clickEl(${el.x||0},${el.y||0},${el.w||20},${el.h||20})"${dis}>↖</button></div>`;
  }).join('');
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function clickEl(x,y,w,h) {
  if (!sessionId) return;
  api('/api/browser-control/mouse/click', { method:'POST', body: JSON.stringify({ session_id:sessionId, x:x+Math.round(w/2), y:y+Math.round(h/2), button:'left' }) }).catch(()=>{});
  canvas.focus();
}
async function navTo(href) { navigate(href); }

// ── Wiring ────────────────────────────────────────────────────────────────────
document.getElementById('btn-back').onclick    = goBack;
document.getElementById('btn-forward').onclick = goForward;
document.getElementById('btn-reload').onclick  = reload;
document.getElementById('btn-close').onclick   = closeSession;
document.getElementById('launch-btn').onclick  = launchSession;
document.getElementById('empty-launch-btn').onclick = launchSession;
document.getElementById('url-form').onsubmit = e => { e.preventDefault(); navigate(urlInput.value); };
urlInput.addEventListener('focus', e => e.target.select());
document.getElementById('sidebar-toggle').onclick = () => {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('hidden', !sidebarOpen);
  document.getElementById('sidebar-toggle').textContent = sidebarOpen ? '⊟' : '⊞';
};
document.querySelectorAll('.stab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); activeTab = btn.dataset.tab; renderSidebar();
  };
});

// Token expiry warning
if (UI_TOKEN) {
  try {
    const exp = parseInt(UI_TOKEN.split('.')[0].split(':')[1], 10);
    const ms = (exp * 1000) - Date.now() - 5 * 60 * 1000;
    if (ms > 0) setTimeout(() => showErr('Session expiring — refresh the page'), ms);
  } catch {}
}
setStatus('idle', 'ready');
</script>
</body>
